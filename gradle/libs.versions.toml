[versions]

kotlin = "2.1.20-RC"
compose = "1.7.3"
composeIcons = "1.1.1"
materialKolor = "2.0.1"
colorpicker = "1.1.2"
kotlinx-coroutines = "1.10.1"
haze = "1.3.1"
hypnotic = "0.4.0-b02"
hotreload = "1.0.0-alpha01"

[libraries]

composeIcons-fontAwesome = { module = "br.com.devsrsouza.compose.icons:font-awesome", version.ref = "composeIcons" }
materialKolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }
compose-colorpicker = { module = "com.github.skydoves:colorpicker-compose", version.ref = "colorpicker" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }

haze-core = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
hypnoticCanvas = { module = "com.mikepenz.hypnoticcanvas:hypnoticcanvas", version.ref = "hypnotic" }

[plugins]

multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
hotreload = { id = "org.jetbrains.compose.hot-reload", version.ref = "hotreload" }